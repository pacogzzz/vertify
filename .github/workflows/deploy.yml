# Publica a produccion cuando un colaborador que NO es el dueno sube
# cambios a main.
#
# Por que existe: el plan Hobby de Vercel solo deja publicar a miembros
# del equipo. Cuando el dueno hace push, Vercel publica solo y este job
# no corre. Cuando lo hace alguien mas, Vercel lo bloquea y este job
# publica en su lugar usando el token del dueno.
#
# Importante: aqui NO se compila. Se le manda el codigo a Vercel y Vercel
# lo compila de su lado, que es donde viven las variables de entorno
# (Supabase, Gemini, correo). Compilar en GitHub tumbo produccion una vez
# porque el build salia sin esas llaves.
name: Deploy a produccion

on:
  push:
    branches: [main]

concurrency:
  group: deploy-produccion
  cancel-in-progress: true

jobs:
  deploy:
    if: github.actor != 'pacogzzz'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_HGk0yMhxwnTm7ltx76I749qq
      VERCEL_PROJECT_ID: prj_TMdhu41iUmeCO4lErgar49tmC9cD
    steps:
      - uses: actions/checkout@v4

      - run: npm install --global vercel@latest

      - name: Manda el codigo a Vercel y publica
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
